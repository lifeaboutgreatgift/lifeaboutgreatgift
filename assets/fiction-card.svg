<svg width="480" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow animation -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9bce;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c77dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9bce;stop-opacity:1" />
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a14;stop-opacity:1" />
    </linearGradient>

    <!-- Pulse animation -->
    <style>
      .border-line {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawBorder 2s ease forwards;
      }

      @keyframes drawBorder {
        to { stroke-dashoffset: 0; }
      }

      .fade-in {
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }

      .fade-in-1 { animation-delay: 0.8s; }
      .fade-in-2 { animation-delay: 1.2s; }
      .fade-in-3 { animation-delay: 1.6s; }
      .fade-in-4 { animation-delay: 2s; }
      .fade-in-5 { animation-delay: 2.4s; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      .glow-pulse {
        animation: glowPulse 3s ease-in-out infinite;
        animation-delay: 2.5s;
      }

      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; }
        50%       { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="478" height="198" x="1" y="1"
        rx="16" ry="16"
        fill="url(#bgGrad)" />

  <!-- Animated border -->
  <rect width="478" height="198" x="1" y="1"
        rx="16" ry="16"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="1.5"
        class="border-line glow-pulse"
        filter="url(#glow)" />

  <!-- Book emoji -->
  <text x="32" y="52"
        font-size="28"
        class="fade-in fade-in-1">📖</text>

  <!-- Project title -->
  <text x="70" y="52"
        font-family="Georgia, serif"
        font-size="22"
        font-weight="bold"
        fill="#ff9bce"
        class="fade-in fade-in-1"
        filter="url(#glow)">Fiction Blog</text>

  <!-- First project badge -->
  <rect x="70" y="62" width="90" height="18"
        rx="9" ry="9"
        fill="#1a0a14"
        stroke="#c77dff"
        stroke-width="1"
        class="fade-in fade-in-2" />
  <text x="115" y="75"
        font-family="monospace"
        font-size="10"
        fill="#c77dff"
        text-anchor="middle"
        class="fade-in fade-in-2">✦ first project</text>

  <!-- Divider line -->
  <line x1="32" y1="92" x2="448" y2="92"
        stroke="#ff9bce"
        stroke-width="0.4"
        opacity="0.3"
        class="fade-in fade-in-2" />

  <!-- Description line 1 -->
  <text x="32" y="116"
        font-family="Georgia, serif"
        font-size="12"
        fill="#e8d5e0"
        font-style="italic"
        class="fade-in fade-in-3">
    "A place where words make you feel alive —
  </text>

  <!-- Description line 2 -->
  <text x="32" y="134"
        font-family="Georgia, serif"
        font-size="12"
        fill="#e8d5e0"
        font-style="italic"
        class="fade-in fade-in-3">
    where one story holds a thousand perspectives."
  </text>

  <!-- Tech stack badges -->
  <!-- HTML badge -->
  <rect x="32" y="148" width="46" height="18"
        rx="4" fill="#E34F26" opacity="0.85"
        class="fade-in fade-in-4" />
  <text x="55" y="161"
        font-family="monospace"
        font-size="10"
        fill="white"
        text-anchor="middle"
        class="fade-in fade-in-4">HTML</text>

  <!-- CSS badge -->
  <rect x="84" y="148" width="40" height="18"
        rx="4" fill="#1572B6" opacity="0.85"
        class="fade-in fade-in-4" />
  <text x="104" y="161"
        font-family="monospace"
        font-size="10"
        fill="white"
        text-anchor="middle"
        class="fade-in fade-in-4">CSS</text>

  <!-- JS badge -->
  <rect x="130" y="148" width="32" height="18"
        rx="4" fill="#F7DF1E" opacity="0.85"
        class="fade-in fade-in-4" />
  <text x="146" y="161"
        font-family="monospace"
        font-size="10"
        fill="black"
        text-anchor="middle"
        class="fade-in fade-in-4">JS</text>

  <!-- Live link -->
  <rect x="368" y="144" width="80" height="26"
        rx="13" ry="13"
        fill="none"
        stroke="#ff9bce"
        stroke-width="1"
        class="fade-in fade-in-5" />
  <text x="408" y="161"
        font-family="monospace"
        font-size="11"
        fill="#ff9bce"
        text-anchor="middle"
        class="fade-in fade-in-5">Live ↗</text>

</svg>
